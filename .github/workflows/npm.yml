name: CI

on: [push, pull_request]

jobs:
  verify:
    name: Build, Lint, Coverage & Interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Use Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Use Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build & Lint
        run: npm run build && npm run lint

      - name: Node.js Coverage
        run: npm run coverage:node

      - name: Deno Coverage
        run: npm run coverage:deno

      - name: Examples, Pack, Interop & Browser Tests
        run: npm run test:examples && npm run test:pack && npm run test:interop && npm run test:browser
