name: NPM

on: [push, pull_request]

jobs:
  build:
    name: Build
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 20
          - 22
          - 24
          - 26

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package.json

      - name: Install Dependencies
        run: npm install

      - name: Test
        run: npm test

  pack:
    name: Pack
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install Dependencies
        run: npm install

      - name: Generate Version
        run: ./scripts/generate-version.sh

      - name: Pack Testing
        run: ./scripts/npm-pack-testing.sh

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v'))
    name: Publish
    needs: [build, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install Dependencies
        run: npm install --ignore-scripts

      - name: Generate Version
        run: ./scripts/generate-version.sh

      - name: Build Dist
        run: npm run dist

      - name: Check Branch
        id: check-branch
        run: |
          if [[ $GITHUB_REF =~ ^refs/heads/(main|v[0-9]+\.[0-9]+.*)$ ]]; then
              echo "match=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Is A Publish Branch
        if: steps.check-branch.outputs.match == 'true'
        shell: bash
        run: |
          package=$(node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const { name, version } = JSON.parse(readFileSync("package.json", "utf8"))
            console.log(name, version)
          ')
          read -r name version <<< "$package"

          versions=$(npm view "$name" versions --json)
          published=$(node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const versions = JSON.parse(readFileSync(0, "utf8"))
            console.log([versions].flat().includes(process.argv[1]))
          ' "$version" <<< "$versions")
          if [[ $published == true ]]; then
            echo "$name@$version already exists on npm, skipping publish."
            exit 0
          fi

          # Set the tag explicitly so npm never promotes a prerelease to latest.
          tag=latest
          if [[ ${version%%+*} == *-* ]]; then
            tag=next
          fi
          npm publish --tag "$tag"
      - name: Is Not A Publish Branch
        if: steps.check-branch.outputs.match != 'true'
        run: echo 'Not A Publish Branch'
